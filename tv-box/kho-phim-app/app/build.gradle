plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.khophim.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.khophim.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Cài bằng adb cho đúng một box nhà mình, không lên Play Store: ký bằng khoá debug là đủ.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
